# deploy.yml — 已封存站点的跳转提示页部署（仅 Cloudflare Pages）。
#
# 本站点不再构建：dist-stub/ 是手写的静态产物，直接整目录直传，CI 里不装依赖、不跑构建。
# 站点内容已迁往 www.pldduck.com（仓库 ououduck/pldduck），这里只负责迁移公告与 301 跳转，
# 因此只在真正需要改动跳转表/公告页时手动执行一次。
#
# 不再部署到 EdgeOne Pages：旧域名只保留 Cloudflare 一处出口，跳转规则（_redirects）
# 也只有 Cloudflare 支持，避免两处内容不一致。
#
# ⚠️ blog.pldduck.com 的 CNAME 指向 d-blog-cy0.pages.dev（Pages 项目名与 pages.dev 子域
#    同名；`d-blog.pages.dev` 是别人账户里的 Hugo 站）。项目名由触发时的输入决定，
#    并有「Verify Pages project exists」一步兜底。
name: Deploy migration notice to Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      project_name:
        description: 'Cloudflare Pages 项目名（必须是真正绑定 blog.pldduck.com 的那个，见下方校验步骤的账户项目列表）'
        required: true
        type: string
        default: 'd-blog-cy0'

concurrency:
  group: deploy-stub
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ inputs.project_name }}
        # 项目名写错不会报错，只会在账户里新建一个空项目：blog.pldduck.com 仍然指向
        # 真正的旧项目，于是"部署成功"而线上毫无变化。所以先列清单再逐个比对。
        run: |
          npx --yes wrangler@4.123.0 pages project list | tee /tmp/projects.txt
          if ! awk 'NR>1 {print $1}' /tmp/projects.txt | grep -qx "$PROJECT_NAME"; then
            echo "::error::Cloudflare Pages 项目列表里没有「$PROJECT_NAME」。上面就是账户内的全部项目，请改用真正绑定 blog.pldduck.com 的那个名字重新触发。"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: ${{ inputs.project_name }}
        # 直传（direct upload）：平台不构建，不消耗构建额度。
        # wrangler 固定精确版本：浮动 major tag 每次从 npm 拉取，部署行为不可复现且不可审计。
        run: npx --yes wrangler@4.123.0 pages deploy dist-stub --project-name="$PROJECT_NAME" --branch=main --commit-dirty=true
