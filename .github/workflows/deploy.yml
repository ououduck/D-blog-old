# deploy.yml — 已封存站点的跳转提示页部署（仅 Cloudflare Pages）。
#
# 本站点不再构建：dist-stub/ 是手写的静态产物，直接整目录直传，CI 里不装依赖、不跑构建。
# 站点内容已迁往 www.pldduck.com（仓库 ououduck/pldduck），这里只负责迁移公告与 301 跳转，
# 因此只在真正需要改动跳转表/公告页时手动执行一次。
#
# 不再部署到 EdgeOne Pages：旧域名只保留 Cloudflare 一处出口，跳转规则（_redirects）
# 也只有 Cloudflare 支持，避免两处内容不一致。
name: Deploy migration notice to Cloudflare Pages

on:
  workflow_dispatch:

concurrency:
  group: deploy-stub
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # 直传（direct upload）：平台不构建，不消耗构建额度。
        # wrangler 固定精确版本：浮动 major tag 每次从 npm 拉取，部署行为不可复现且不可审计。
        run: npx --yes wrangler@4.123.0 pages deploy dist-stub --project-name=d-blog --branch=main --commit-dirty=true
