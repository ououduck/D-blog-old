<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>跑路的duck · 站点已迁移</title>
  <meta name="robots" content="noindex" />
  <!-- 未知路径不做 canonical 归并（404 规范到新站首页会误导搜索引擎），仅提示并跳转。 -->
  <meta http-equiv="refresh" content="3;url=https://www.pldduck.com/" />
  <link rel="stylesheet" href="/migrate.css" />
</head>

<body>
  <main>
    <hr class="rule" />
    <p class="eyebrow">PLDDUCK · 迁移公告</p>
    <h1>这个地址已不存在，本站已迁移至 <code>www.pldduck.com</code></h1>
    <p>
      D-blog 与个人主页已合并为一个站点，文章、说说、友链、留言板等全部内容在新域名继续更新。
      如果你是从旧书签进来的，文章地址没有变化，直接在新站访问即可。
    </p>
    <p class="muted">本页将在 3 秒后自动前往新站首页。</p>
    <div class="actions">
      <a class="button" href="https://www.pldduck.com/">立即前往</a>
    </div>
    <noscript>
      <p class="muted">
        未启用 JavaScript 时，请点击上方按钮，或直接访问
        <a class="link" href="https://www.pldduck.com/">www.pldduck.com</a>。
      </p>
    </noscript>
  </main>
  <script src="/migrate.js"></script>
</body>

</html>
