<!doctype html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>跑路的duck · 站点已迁移</title>
  <meta name="description" content="D-blog 已并入 www.pldduck.com，本站点不再更新。" />
  <!-- 迁移提示页本身不参与收录：内容已整体搬到新站，规范链接指向新站首页。 -->
  <link rel="canonical" href="https://www.pldduck.com/" />
  <!-- 深层路径由 _redirects 直接 301 到新站同路径，不会走到本页；本页只服务根路径与
       未知路径，所以跳转目标是固定的新站首页，无需按 pathname 计算。 -->
  <meta http-equiv="refresh" content="3;url=https://www.pldduck.com/" />
  <link rel="stylesheet" href="/migrate.css" />
</head>

<body>
  <main>
    <hr class="rule" />
    <p class="eyebrow">PLDDUCK · 迁移公告</p>
    <h1>本站已迁移至 <code>www.pldduck.com</code></h1>
    <p>
      D-blog 与个人主页已合并为一个站点，文章、说说、友链、留言板等全部内容在新域名继续更新，
      文章地址保持不变。
    </p>
    <p class="muted">旧链接无需修改：本站已对全部路径配置 301 永久跳转。本页将在 3 秒后自动前往新站。</p>
    <div class="actions">
      <a class="button" href="https://www.pldduck.com/">立即前往</a>
    </div>
    <noscript>
      <p class="muted">
        未启用 JavaScript 时，请点击上方按钮，或直接访问
        <a class="link" href="https://www.pldduck.com/">www.pldduck.com</a>。
      </p>
    </noscript>
  </main>
  <script src="/migrate.js"></script>
</body>

</html>
